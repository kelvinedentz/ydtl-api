x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: ../.env
  environment:
    REDIS_URL: redis://redis:6379/0
    YTDLP_POT_BASE_URL: http://pot-provider:4416
  depends_on:
    redis:
      condition: service_healthy
    pot-provider:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "app.worker.run", "worker"]
    stop_grace_period: 120s

  sweeper:
    <<: *app
    command: ["python", "-m", "app.worker.run", "sweeper"]

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data: